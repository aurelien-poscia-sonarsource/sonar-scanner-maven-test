name: Call Endpoint with WIF JWT (Debug Mode)

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  id-token: write 
  contents: read  

jobs:
  call-custom-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch OIDC Token
        id: fetch-token
        uses: actions/github-script@v7
        with:
          script: |
            const audience = 'your-custom-audience'; 
            
            // Fetch the JWT
            const idToken = await core.getIDToken(audience);
            
            // GitHub automatically masks the exact token string.
            // We bypass this by splitting the JWT at the periods.
            const parts = idToken.split('.');
            
            console.log("--- JWT PARTS FOR DEBUGGING ---");
            console.log("Header:  " + parts[0]);
            console.log("Payload: " + parts[1]);
            console.log("Signature: " + parts[2]);
            
            // As an alternative, Base64 encode the entire string.
            // You can copy this and decode it in your local terminal.
            const base64Token = Buffer.from(idToken).toString('base64');
            console.log("Base64 Encoded: " + base64Token);
            
            // Output the token for the next steps
            core.setOutput('jwt', idToken);

      - name: Call Endpoint X
        env:
          ENDPOINT_URL: "https://api.yourdomain.com/x"
          JWT: ${{ steps.fetch-token.outputs.jwt }}
        run: |
          # Print the token from the bash environment
          echo "Token in bash environment: $JWT"
          
          echo "Calling endpoint..."
          curl -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "github_actions", "repository": "${{ github.repository }}"}' \
            --fail-with-body
