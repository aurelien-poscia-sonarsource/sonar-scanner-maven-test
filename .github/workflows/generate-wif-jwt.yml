name: Call Endpoint with WIF JWT (Debug Mode)

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  id-token: write 
  contents: read  

jobs:
  call-custom-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch OIDC Token
        id: fetch-token
        uses: actions/github-script@v7
        with:
          script: |
            const audience = 'your-custom-audience'; 
            
            // Fetch the JWT
            const idToken = await core.getIDToken(audience);
            
            // REMOVED: core.setSecret(idToken);
            // By removing the line above, GitHub will no longer mask this string.
            
            // Print directly to the step summary/logs
            console.log("Here is the raw JWT from GitHub:");
            console.log(idToken);
            
            // Output the token for the next steps
            core.setOutput('jwt', idToken);

      - name: Call Endpoint X
        env:
          ENDPOINT_URL: "https://api.yourdomain.com/x"
          JWT: ${{ steps.fetch-token.outputs.jwt }}
        run: |
          # Print the token from the bash environment
          echo "Token in bash environment: $JWT"
          
          echo "Calling endpoint..."
          curl -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "github_actions", "repository": "${{ github.repository }}"}' \
            --fail-with-body
